[tool.poetry]
name = "mysite-prod"
version = "1.0.0"
description = "Django application for Skillbox practical work 20.7"
authors = ["Artem"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
asgiref = "3.6.0"
Django = "4.2"
django-debug-toolbar = "4.0.0"
django-filter = "22.1"
djangorestframework = "3.14.0"
Pillow = "9.4.0"
pytz = "2022.7.1"
sqlparse = "0.4.2"
gunicorn = "23.0.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

